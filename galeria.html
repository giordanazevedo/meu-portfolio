<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Artes | Giordana Livia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="bg-galeria">

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">GL<span>.</span></a>
            <a href="index.html" class="btn-back"><i class='bx bx-left-arrow-alt'></i> Voltar</a>
        </div>
    </nav>

    <main class="galeria-section">
        <div class="container">
            <h1 class="section-title">Minha Galeria de <span>Artes</span></h1>
            
            <!-- Barra de Filtros -->
            <div class="gallery-filters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="estampas">Estampas & Canecas</button>
                <button class="filter-btn" data-filter="branding">Identidade Visual</button>
                <button class="filter-btn" data-filter="social-media">Social Media</button>
            </div>

            <div class="grid-galeria">
                <div class="card-art" data-category="estampas">
                    <img src="camiseta-avante.jpg" alt="Camiseta Sempre Avante">
                    <div class="card-art-info">
                        <h3>Sempre Avante</h3>
                        <p>Design de Estampa</p>
                    </div>
                </div>  
                
                <div class="card-art" data-category="estampas">
                    <img src="camiseta-cha.jpg" alt="Chá das Amigas">
                    <div class="card-art-info">
                        <h3>Chá das Amigas</h3>
                        <p>Ilustração e Estampa</p>
                    </div>
                </div>

                <div class="card-art" data-category="estampas">
                    <img src="camiseta-caminhada.jpg" alt="Caminhada do Bem">
                    <div class="card-art-info">
                        <h3>Caminhada do Bem</h3>
                        <p>Design para Eventos</p>
                    </div>
                </div>
                
                <div class="card-art" data-category="branding">
                    <img src="mockup-livtech.jpg" alt="Livtech Branding">
                    <div class="card-art-info">
                        <h3>Livtech Branding</h3>
                        <p>Identidade Visual & UI/UX</p>
                    </div>
                </div>

                <div class="card-art" data-category="estampas">
                    <img src="canecas-hp.jpg" alt="Canecas Harry Potter">
                    <div class="card-art-info">
                        <h3>Coleção Hogwarts</h3>
                        <p>Personalizados</p>
                    </div>
                </div>

                <div class="card-art" data-category="social-media">
                    <img src="posts-igreja.jpg" alt="Social Media IASD">
                    <div class="card-art-info">
                        <h3>Social Media IASD</h3>
                        <p>Posts e Convites</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterBtns = document.querySelectorAll('.filter-btn');
            const galleryCards = document.querySelectorAll('.card-art');

            function applyFilter(category) {
                const grid = document.querySelector('.grid-galeria');
                // Atualiza estado do botão ativo
                filterBtns.forEach(btn => {
                    if (btn.getAttribute('data-filter') === category) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // Alterna layout especial para estampas
                if (category === 'estampas') {
                    grid.classList.add('estampas-layout');
                } else {
                    grid.classList.remove('estampas-layout');
                }

                // Filtra os cartões com animação suave
                galleryCards.forEach(card => {
                    const cardCategory = card.getAttribute('data-category');
                    if (category === 'all' || cardCategory === category) {
                        // Quando estiver no layout de estampas, deixamos o CSS controlar o display
                        if (grid.classList.contains('estampas-layout')) {
                            card.style.display = '';
                        } else {
                            card.style.display = 'flex';
                        }
                        setTimeout(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'scale(1)';
                        }, 50);
                    } else {
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            card.style.display = 'none';
                        }, 300);
                    }
                });
            }

            // Ouvinte de clique nos botões
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const category = e.target.getAttribute('data-filter');
                    applyFilter(category);
                });
            });

            // Adiciona transição CSS inicial suave
            galleryCards.forEach(card => {
                card.style.transition = 'opacity 0.3s ease, transform 0.3s ease, border-color 0.4s ease, box-shadow 0.4s ease';
            });

            // Lê parâmetro de categoria da URL
            const urlParams = new URLSearchParams(window.location.search);
            const initialFilter = urlParams.get('filter');
            if (initialFilter) {
                applyFilter(initialFilter);
            }
        });
    </script>
</body>
</html>
